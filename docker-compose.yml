services:
  waha:
    image: devlikeapro/waha
    container_name: waha
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./sessions:/app/.sessions
    environment:
      - WHATSAPP_HOOK_URL=http://host.docker.internal:8000/webhook
      - WHATSAPP_HOOK_EVENTS=message
    extra_hosts:
      - "host.docker.internal:host-gateway"